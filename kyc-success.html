<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KYC Success</title>
</head>
<body>
  <p id="msg">Verifying your KYC…</p>
  <script>
    (function () {
      "use strict";

      var API_URL = "http://127.0.0.1:8000/api/kyc/digilocker-success/";
      var FORM_URL = "http://localhost:8000/kyc-form.html";
      var FAILURE_URL = "http://localhost:8000/kyc-failure.html";
      var msg = document.getElementById("msg");

      var requestId = new URLSearchParams(window.location.search).get("request_id");

      if (!requestId) {
        msg.textContent = "Missing request_id. Redirecting…";
        window.location.replace(FAILURE_URL);
        return;
      }

      var xhr = new XMLHttpRequest();
      xhr.open("POST", API_URL, true);
      xhr.setRequestHeader("Content-Type", "application/json");

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          window.location.replace(FORM_URL);
        } else {
          msg.textContent = "KYC verification failed. Redirecting…";
          window.location.replace(FAILURE_URL);
        }
      };

      xhr.onerror = function () {
        msg.textContent = "Network error. Redirecting…";
        window.location.replace(FAILURE_URL);
      };

      xhr.send(JSON.stringify({ request_id: requestId }));
    })();
  </script>
</body>
</html>
